[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-tablet-backend"
version = "0.1.0"
description = "Low-latency Linux screen streaming and virtual Apple Pencil tablet backend"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ipad-tablet-backend = "ipad_tablet_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
