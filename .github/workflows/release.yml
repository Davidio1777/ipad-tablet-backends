name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows distribution
        shell: pwsh
        run: WindowsBackEnd/build.ps1
      - name: Package Windows distribution
        shell: pwsh
        run: Compress-Archive -Path WindowsBackEnd/dist/* -DestinationPath iPad-Tablet-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-Tablet-Windows-x64
          path: iPad-Tablet-Windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: iPad-Tablet-Windows-x64.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
        working-directory: LinuxBackEnd
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-Tablet-Linux
          path: LinuxBackEnd/dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LinuxBackEnd/dist/*
          generate_release_notes: true
