name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows distribution
        shell: pwsh
        run: WindowsBackEnd/build.ps1
      - name: Test Windows UDP and USB protocols
        shell: pwsh
        run: |
          $env:IPAD_TABLET_BACKEND_EXE = "$PWD\WindowsBackEnd\dist\backend\rayshine-backend.exe"
          dotnet run --project WindowsBackEnd/tests/IPadTablet.Backend.Tests/IPadTablet.Backend.Tests.csproj -c Release
      - name: Package Windows distribution
        shell: pwsh
        run: |
          Compress-Archive -Path WindowsBackEnd/dist/* -DestinationPath RayShine-Windows-x64.zip
          $hash = (Get-FileHash RayShine-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RayShine-Windows-x64.zip" | Set-Content RayShine-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RayShine-Windows-x64
          path: |
            RayShine-Windows-x64.zip
            RayShine-Windows-x64.zip.sha256

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qmake6 \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev libfuse2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Qt 6 AppImage
        run: LinuxBackEnd/appimage/build-appimage.sh
      - run: python -m pip install build
      - run: python -m build --wheel
        working-directory: LinuxBackEnd
      - uses: actions/upload-artifact@v4
        with:
          name: RayShine-Linux
          path: LinuxBackEnd/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RayShine-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
