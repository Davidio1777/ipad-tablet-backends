name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: LinuxBackEnd/pyproject.toml
      - run: python -m pip install -e LinuxBackEnd
      - run: python -m unittest discover -s tests -v
        working-directory: LinuxBackEnd

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build WindowsBackEnd/src/IPadTablet.Backend/IPadTablet.Backend.csproj -c Release
      - run: dotnet build WindowsBackEnd/src/IPadTablet.Backend.Gui/IPadTablet.Backend.Gui.csproj -c Release
      - run: dotnet build WindowsBackEnd/opentabletdriver/Plugin/IPadPencilWindowsHub.csproj -c Release
      - run: dotnet build LinuxBackEnd/opentabletdriver/Plugin/IPadPencilHub.csproj -c Release
