name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install capture tools used by command-generation tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wf-recorder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: LinuxBackEnd/pyproject.toml
      - run: python -m pip install -e LinuxBackEnd
      - run: python -m unittest discover -s tests -v
        working-directory: LinuxBackEnd

  linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libgl1-mesa-dev
      - run: cmake -S LinuxBackEnd/gui -B build/linux-gui -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux-gui --parallel
      - name: Check AppImage scripts
        run: |
          sh -n LinuxBackEnd/appimage/AppRun
          sh -n LinuxBackEnd/appimage/ipad-tablet-install-helper
          bash -n LinuxBackEnd/appimage/build-appimage.sh

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build WindowsBackEnd/src/IPadTablet.Backend/IPadTablet.Backend.csproj -c Release
      - run: dotnet build WindowsBackEnd/src/IPadTablet.Backend.Gui/IPadTablet.Backend.Gui.csproj -c Release
      - run: dotnet build WindowsBackEnd/opentabletdriver/Plugin/IPadPencilWindowsHub.csproj -c Release
      - run: dotnet build LinuxBackEnd/opentabletdriver/Plugin/IPadPencilHub.csproj -c Release
